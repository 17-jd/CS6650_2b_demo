services:
  app:
    build: ./src
    ports: ["127.0.0.1:8080:8080"]
    environment:
      PRODUCT_API_KEY: ${PRODUCT_API_KEY:-hw5-local-demo}
      ENABLE_TEST_ERRORS: ${ENABLE_TEST_ERRORS:-false}
    cpus: 0.5
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.7.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.2.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboard.json:/var/lib/grafana/dashboards/product.json:ro
volumes:
  prometheus-data:
